<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="22" viewBox="0 0 1200 22"
     fill="none" role="img"
     class="rd-axis"
     aria-label="Minimal academic divider">

  <style>
    .rd-axis { --rd-ink:#0f172a; --rd-accent:#4f46e5; }
    @media (prefers-color-scheme: dark) {
      .rd-axis { --rd-ink:#e2e8f0; --rd-accent:#818cf8; }
    }
  </style>

  <defs>
    <linearGradient id="rdFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <mask id="rdMask" maskUnits="userSpaceOnUse"
          x="0" y="0" width="1200" height="22">
      <rect width="1200" height="22" fill="url(#rdFade)"/>
    </mask>

  
    <pattern id="rdMicro" width="20" height="22" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="15.5" x2="0.5" y2="12"
            stroke="var(--rd-ink)" stroke-width="1" stroke-opacity="0.20"/>
    </pattern>

  
    <pattern id="rdMajor" width="100" height="22" patternUnits="userSpaceOnUse">
      <line x1="0.5" y1="15.5" x2="0.5" y2="9"
            stroke="var(--rd-ink)" stroke-width="1" stroke-opacity="0.42"/>
    </pattern>
  </defs>


  <g mask="url(#rdMask)">
    <line x1="0" y1="15.5" x2="1200" y2="15.5"
          stroke="var(--rd-ink)" stroke-width="1" stroke-opacity="0.50"/>
    <rect width="1200" height="22" fill="url(#rdMicro)"/>
    <rect width="1200" height="22" fill="url(#rdMajor)"/>
  </g>


  <circle cx="600" cy="15.5" r="5.5"
          fill="var(--rd-accent)" fill-opacity="0.12"/>
  <circle cx="600" cy="15.5" r="1.75"
          fill="var(--rd-accent)"/>
</svg>
